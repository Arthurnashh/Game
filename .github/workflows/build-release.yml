name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install MSVC v141 and Windows SDK 10.0.19041
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation was not found.' }

          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_enterprise.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_enterprise.exe' -OutFile $bootstrapper
          $installerArgs = @(
            'modify',
            '--installPath', "`"$vs`"",
            '--channelId', 'VisualStudio.17.Release',
            '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.19041',
            '--quiet',
            '--norestart',
            '--wait'
          )
          $installerProcess = Start-Process -FilePath $bootstrapper -ArgumentList $installerArgs -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Visual Studio component installation failed: $($installerProcess.ExitCode)" }

          $vsWithV141 = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          $v141Compiler = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory -Filter '14.16*' | Select-Object -First 1
          if ($vsWithV141 -ne $vs -or -not $v141Compiler -or -not (Test-Path (Join-Path $v141Compiler.FullName 'bin\Hostx64\x64\cl.exe'))) {
            throw 'MSVC v141 is still unavailable after Visual Studio Installer completed.'
          }

          $sdkLib = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib\10.0.19041.0\um\x64\d3d11.lib'
          if (-not (Test-Path $sdkLib)) { throw 'Windows SDK 10.0.19041.0 was not installed.' }
          $d3dCompilerLib = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib\10.0.19041.0\um\x64\d3dcompiler.lib'
          if (-not (Test-Path $d3dCompilerLib)) { throw 'Windows SDK D3DCompiler library was not installed.' }
          $shcoreLib = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib\10.0.19041.0\um\x64\shcore.lib'
          if (-not (Test-Path $shcoreLib)) { throw 'Windows SDK Shcore library was not installed.' }

      - uses: microsoft/setup-msbuild@v2

      - name: Verify private build settings
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'lib/lib2010.vcxproj' -Raw
          foreach ($target in @('Retail|x64', 'Retail Server|Win32')) {
            $group = $project.Project.ItemDefinitionGroup | Where-Object {
              $_.Condition -eq "'`$(Configuration)|`$(Platform)'=='$target'"
            }
            if (-not $group -or $group.ClCompile.PreprocessorDefinitions -notmatch '(^|;)DAYZ_PRIVATE_SERVER=1(;|$)') {
              throw "$target must define DAYZ_PRIVATE_SERVER=1."
            }
            if ($group.Link.DelayLoadDLLs -match '(^|;)steam_api\.dll(;|$)') {
              throw "$target must not delay-load Steam."
            }
          }

          $steamDlls = @($project.Project.ItemGroup.CustomBuild | Where-Object {
            $_.Include -like '..\extern\Steamworks\bin\*.dll'
          })
          if ($steamDlls.Count -ne 1 -or $steamDlls[0].Include -notlike '*\steam_api.dll') {
            throw 'Only the legacy steam_api.dll entry may remain in the project.'
          }
          $steamApi = $steamDlls[0]
          if ($steamApi.ExcludedFromBuild.Condition -ne "'`$(Configuration)|`$(Platform)'=='Retail Server|Win32'" -or $steamApi.ExcludedFromBuild.InnerText -ne 'true' -or $steamApi.Command.Condition -contains "'`$(Configuration)|`$(Platform)'=='Retail Server|Win32'") {
            throw 'The private server must not build or copy Steam runtime files.'
          }

      - name: Build x64 RSA dependency
        shell: pwsh
        run: |
          msbuild OFPPatch/RSA/rsa_x64.vcxproj -m -t:Build -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v141 -p:WindowsTargetPlatformVersion=10.0.19041.0
          if ($LASTEXITCODE -ne 0) { throw "RSA build failed: $LASTEXITCODE" }

          $library = 'build/port-x64/RSA/rsa_x64.lib'
          if (-not (Test-Path $library)) { throw "RSA output missing: $library" }

      - name: Build Win32 and x64 Speex dependencies
        shell: pwsh
        run: |
          foreach ($platform in @('Win32', 'x64')) {
            foreach ($project in @('.github/build-deps/speex-x64.vcxproj', '.github/build-deps/speexdsp-x64.vcxproj')) {
              msbuild $project -m -t:Build -p:Configuration=Release -p:Platform=$platform -p:PlatformToolset=v141 -p:WindowsTargetPlatformVersion=10.0.19041.0
              if ($LASTEXITCODE -ne 0) { throw "Audio dependency build failed: $project ($platform, $LASTEXITCODE)" }
            }
          }

          foreach ($library in @('build/port-x86/audio/libspeexMt.lib', 'build/port-x86/audio/libspeexdspMt.lib', 'build/port-x64/audio/libspeexMt.lib', 'build/port-x64/audio/libspeexdspMt.lib')) {
            if (-not (Test-Path $library)) { throw "Audio dependency output missing: $library" }
          }

      - name: Build x64 libogg dependency
        shell: pwsh
        run: |
          msbuild extern/audio-x64-src/ogg/win32/VS2015/libogg.sln -m -t:Build -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v141 -p:WindowsTargetPlatformVersion=10.0.19041.0
          if ($LASTEXITCODE -ne 0) { throw "libogg build failed: $LASTEXITCODE" }

          $library = 'extern/audio-x64-src/ogg/win32/VS2015/x64/Release/libogg.lib'
          if (-not (Test-Path $library)) { throw "libogg output missing: $library" }

      - name: Build x64 client
        shell: pwsh
        run: |
          msbuild DayZ2010.sln -m -t:Build -p:Configuration=Retail -p:Platform=x64 -p:PlatformToolset=v141 -p:WindowsTargetPlatformVersion=10.0.19041.0
          if ($LASTEXITCODE -ne 0) { throw "Client build failed: $LASTEXITCODE" }

      - name: Build Win32 dedicated server
        shell: pwsh
        run: |
          msbuild DayZ2010.sln -m -t:Build '-p:Configuration=Retail Server' -p:Platform=Win32 -p:PlatformToolset=v141 -p:WindowsTargetPlatformVersion=10.0.19041.0
          if ($LASTEXITCODE -ne 0) { throw "Server build failed: $LASTEXITCODE" }

      - name: Collect candidate binaries
        shell: pwsh
        run: |
          $targets = @(
            @{ Name = 'client'; Directory = 'build/port-x64/dist'; Executable = 'DayZ.exe' },
            @{ Name = 'server'; Directory = 'dist'; Executable = 'DayZServer.exe' }
          )

          foreach ($target in $targets) {
            $source = Join-Path $PWD $target.Directory
            $destination = Join-Path $PWD "out/$($target.Name)"
            $executable = Join-Path $source $target.Executable
            if (-not (Test-Path $executable)) { throw "Build output missing: $executable" }
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -LiteralPath $executable -Destination $destination
            Get-ChildItem -LiteralPath $source -File -Filter '*.dll' | Copy-Item -Destination $destination
          }

      - name: Check package script with small fixtures
        shell: pwsh
        run: pwsh -File .github/scripts/test-package-release.ps1

      - name: Write candidate metadata
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $files = @()
          foreach ($role in @('client', 'server')) {
            foreach ($file in Get-ChildItem -LiteralPath "out/$role" -File -Force) {
              $relative = "$role/$($file.Name)"
              $files += [pscustomobject]@{
                path = $relative
                size = [long]$file.Length
                sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          }
          if (-not ($files | Where-Object { $_.path -ceq 'client/DayZ.exe' }) -or
              -not ($files | Where-Object { $_.path -ceq 'server/DayZServer.exe' })) {
            throw 'Candidate executable files are missing.'
          }
          $metadata = [ordered]@{
            candidateRevision = (git rev-parse HEAD).Trim()
            candidateRunId = [string]$env:GITHUB_RUN_ID
            artifactName = "dayz-candidate-$env:GITHUB_RUN_ID"
            files = @($files | Sort-Object path -CaseSensitive)
          }
          $json = ConvertTo-Json -InputObject $metadata -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $PWD 'out/candidate-metadata.json'), $json, [System.Text.UTF8Encoding]::new($false))

      - name: Upload untagged test candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dayz-candidate-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Require tested compatibility record
        id: tested
        shell: pwsh
        run: |
          $report = Get-Content -LiteralPath 'release-assets/COMPATIBILITY-TESTED.md' -Raw
          $resultLines = @([regex]::Matches($report, '(?m)^Result:[^\r\n]*\r?$'))
          if ($resultLines.Count -ne 1 -or $resultLines[0].Value.TrimEnd("`r") -cne 'Result: PASS') {
            throw 'The compatibility report must contain exactly one result field with the exact value: Result: PASS'
          }
          $labels = @(
            'Candidate run ID',
            'Candidate revision',
            'Candidate artifact name',
            'Client executable SHA-256',
            'Server executable SHA-256',
            'Client package manifest SHA-256',
            'Server package manifest SHA-256',
            'Server OS / architecture',
            'Client OS / architecture',
            'Clean-extract location (server)',
            'Clean-extract location (client)',
            'Exact server command',
            'Exact client command',
            'Server config / mission',
            'LAN join outcome',
            'Playable-world entry outcome',
            'Disconnect outcome',
            'Reconnect outcome',
            'Server cleanup evidence (process stopped, data/config preserved)',
            'Client log path and relevant excerpts',
            'Server log path and relevant excerpts'
          )
          $values = @{}
          foreach ($label in $labels) {
            $matches = [regex]::Matches($report, "(?m)^- $([regex]::Escape($label)):[ \t]*(.*?)[ \t]*$")
            if ($matches.Count -ne 1 -or [string]::IsNullOrWhiteSpace($matches[0].Groups[1].Value)) {
              throw "Compatibility report must contain one non-empty '$label' field."
            }
            $values[$label] = $matches[0].Groups[1].Value.Trim()
          }
          if ($values['Candidate run ID'] -notmatch '^\d+$') { throw 'Candidate run ID must be numeric.' }
          if ($values['Candidate revision'] -notmatch '(?i)^[0-9a-f]{40,64}$') { throw 'Candidate revision must be a full Git commit ID.' }
          foreach ($label in @('Client executable SHA-256', 'Server executable SHA-256', 'Client package manifest SHA-256', 'Server package manifest SHA-256')) {
            if ($values[$label] -notmatch '(?i)^[0-9a-f]{64}$') { throw "'$label' must be a SHA-256 value." }
          }
          if ($values['Candidate artifact name'] -cne "dayz-candidate-$($values['Candidate run ID'])") {
            throw 'Candidate artifact name must match its run ID.'
          }
          "candidate_run_id=$($values['Candidate run ID'])" >> $env:GITHUB_OUTPUT
          "candidate_revision=$($values['Candidate revision'])" >> $env:GITHUB_OUTPUT
          "candidate_artifact_name=$($values['Candidate artifact name'])" >> $env:GITHUB_OUTPUT
          "client_executable_sha256=$($values['Client executable SHA-256'])" >> $env:GITHUB_OUTPUT
          "server_executable_sha256=$($values['Server executable SHA-256'])" >> $env:GITHUB_OUTPUT
          "client_manifest_sha256=$($values['Client package manifest SHA-256'])" >> $env:GITHUB_OUTPUT
          "server_manifest_sha256=$($values['Server package manifest SHA-256'])" >> $env:GITHUB_OUTPUT

      - name: Install GitHub CLI
        shell: pwsh
        run: |
          if (-not (Get-Command 'gh.exe' -ErrorAction SilentlyContinue)) {
            choco install gh --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install GitHub CLI.' }
          }
          gh version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI is unavailable.' }

      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.tested.outputs.candidate_artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.tested.outputs.candidate_run_id }}

      - name: Verify exact candidate and allowed evidence-only change
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.tested.outputs.candidate_run_id }}
          CANDIDATE_REVISION: ${{ steps.tested.outputs.candidate_revision }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.tested.outputs.candidate_artifact_name }}
          CLIENT_EXECUTABLE_SHA256: ${{ steps.tested.outputs.client_executable_sha256 }}
          SERVER_EXECUTABLE_SHA256: ${{ steps.tested.outputs.server_executable_sha256 }}
        run: |
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the candidate workflow run.' }
          $candidateRun = $runJson | ConvertFrom-Json
          if ([string]$candidateRun.status -cne 'completed' -or [string]$candidateRun.conclusion -cne 'success') {
            throw 'The candidate workflow run did not complete successfully.'
          }
          if ([string]$candidateRun.event -cne 'workflow_dispatch') {
            throw 'The candidate workflow run was not created by workflow_dispatch.'
          }
          if ([string]$candidateRun.path -cne '.github/workflows/build-release.yml' -or
              [string]$candidateRun.name -cne 'Build and Release') {
            throw 'The candidate run used a different workflow.'
          }
          if ([string]$candidateRun.head_sha -ine $env:CANDIDATE_REVISION) {
            throw 'The candidate run revision does not match the compatibility report.'
          }

          $metadataPath = Join-Path $PWD 'candidate/candidate-metadata.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) { throw 'Candidate metadata is missing.' }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ([string]$metadata.candidateRunId -cne $env:CANDIDATE_RUN_ID -or
              [string]$metadata.candidateRevision -ine $env:CANDIDATE_REVISION -or
              [string]$metadata.artifactName -cne $env:CANDIDATE_ARTIFACT_NAME) {
            throw 'Candidate metadata does not match the compatibility report.'
          }

          $actualFiles = @(Get-ChildItem -LiteralPath (Join-Path $PWD 'candidate') -File -Recurse |
            Where-Object { $_.FullName -ne $metadataPath } |
            ForEach-Object { $_.FullName.Substring((Join-Path $PWD 'candidate').TrimEnd('\').Length + 1).Replace('\', '/') })
          $metadataFiles = @($metadata.files)
          if (-not $metadataFiles -or $metadataFiles.Count -ne $actualFiles.Count) { throw 'Candidate artifact file list does not match its metadata.' }
          $declaredPaths = @($metadataFiles | ForEach-Object { [string]$_.path })
          if (@($declaredPaths | Where-Object { $_ -notmatch '^(client|server)/[^/]+$' -or $_ -match '[\\:]' -or $_ -notmatch '(?i)\.(exe|dll)$' }).Count -gt 0) {
            throw 'Candidate metadata contains a path outside the executable/runtime-DLL layout.'
          }
          if (@($declaredPaths | Select-Object -Unique).Count -ne $declaredPaths.Count) { throw 'Candidate metadata has duplicate paths.' }
          $actualSorted = [string[]]$actualFiles
          $declaredSorted = [string[]]$declaredPaths
          [Array]::Sort($actualSorted, [System.StringComparer]::Ordinal)
          [Array]::Sort($declaredSorted, [System.StringComparer]::Ordinal)
          if ([string]::Join("`n", $actualSorted) -cne [string]::Join("`n", $declaredSorted)) {
            throw 'Candidate artifact files do not match the metadata path list.'
          }

          $fileHashes = @{}
          foreach ($entry in $metadataFiles) {
            $path = [string]$entry.path
            $filePath = Join-Path (Join-Path $PWD 'candidate') ($path.Replace('/', '\'))
            $file = Get-Item -LiteralPath $filePath
            $hash = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([long]$entry.size -ne $file.Length -or [string]$entry.sha256 -ine $hash) {
              throw "Candidate file hash/size mismatch: $path"
            }
            $fileHashes[$path] = $hash
          }
          if ($fileHashes['client/DayZ.exe'] -ine $env:CLIENT_EXECUTABLE_SHA256 -or
              $fileHashes['server/DayZServer.exe'] -ine $env:SERVER_EXECUTABLE_SHA256) {
            throw 'Candidate executable hashes do not match the compatibility report.'
          }

          git merge-base --is-ancestor $env:CANDIDATE_REVISION $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Tested candidate revision is not an ancestor of this tag.' }
          $evidencePath = 'release-assets/COMPATIBILITY-TESTED.md'
          $changed = @(git diff --name-only $env:CANDIDATE_REVISION $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare candidate and tagged revisions.' }
          $unexpected = @($changed | Where-Object { $_ -cne $evidencePath })
          if ($unexpected.Count -gt 0) { throw "Files other than the compatibility evidence changed: $($unexpected -join ', ')" }
          if (-not ($changed -ccontains $evidencePath)) { throw 'The compatibility evidence report must change between the tested candidate and the tag.' }

      - name: Fetch LFS objects into cache without checkout
        shell: pwsh
        run: |
          git lfs version
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS is unavailable.' }
          git lfs fetch --include='release-assets/client/**,release-assets/server/**' origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw "Git LFS fetch failed: $LASTEXITCODE" }

      - name: Package, upload, verify, and publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_MANIFEST_SHA256: ${{ steps.tested.outputs.client_manifest_sha256 }}
          SERVER_MANIFEST_SHA256: ${{ steps.tested.outputs.server_manifest_sha256 }}
        run: |
          $sevenZip = Get-Command '7z.exe' -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            choco install 7zip.install --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install 7-Zip.' }
            $sevenZip = Get-Command '7z.exe' -ErrorAction Stop
          }
          $tag = $env:GITHUB_REF_NAME
          $outputRoot = Join-Path $env:RUNNER_TEMP 'dayz-release'
          $stageRoot = Join-Path $PWD '.release-stage'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $stageRoot -Force | Out-Null
          $notesPath = Join-Path $outputRoot 'release-notes.md'
          $notes = @"
          Build: $tag

          Client: Retail x64. Dedicated server: Retail Server Win32. These
          packages are for private/LAN use only. Steam and BattlEye are
          disabled; there is no account authentication or anti-cheat protection.

          Each package is split into numbered ZIP parts. Download every part
          into one folder and extract from the `.zip.001` file with 7-Zip.
          "@
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))
          $releaseCreated = $false
          $expectedAssets = @()

          try {
            gh release create $tag --draft --verify-tag --title "DayZ $tag" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release: $LASTEXITCODE" }
            $releaseCreated = $true

            foreach ($package in @(
              @{ Role = 'client'; Name = 'Client'; Executable = 'DayZ.exe'; ExpectedManifest = $env:CLIENT_MANIFEST_SHA256 },
              @{ Role = 'server'; Name = 'Server'; Executable = 'DayZServer.exe'; ExpectedManifest = $env:SERVER_MANIFEST_SHA256 }
            )) {
              $prefix = "DayZ-$($package.Name)-$tag"
              $stage = Join-Path $stageRoot $package.Name
              $manifest = Join-Path $outputRoot "$prefix.content-manifest.txt"
              $archive = Join-Path $outputRoot "$prefix.zip"
              $checksums = Join-Path $outputRoot "$prefix.parts.sha256"
              $binaryDirectory = Join-Path $PWD "candidate\$($package.Role)"
              $computedHash = & .github/scripts/package-release.ps1 `
                -Role $package.Role `
                -BinaryDirectory $binaryDirectory `
                -StageDirectory $stage `
                -ManifestPath $manifest `
                -RepositoryRoot $PWD `
                -ArchivePath $archive `
                -ChecksumPath $checksums `
                -SevenZipPath $sevenZip.Source
              if ($computedHash -notmatch '(?i)^[0-9a-f]{64}$') { throw "Packaging did not return a manifest hash for $($package.Name)." }
              if ($computedHash -ine $package.ExpectedManifest) {
                throw "$($package.Name) content manifest does not match the tested compatibility report."
              }

              $parts = @(Get-ChildItem -LiteralPath $outputRoot -File -Filter "$prefix.zip.*" |
                Where-Object { $_.Name -match '\.\d{3}$' } | Sort-Object Name)
              if (-not $parts) { throw "No split ZIP parts were created for $($package.Name)." }
              $uploadFiles = @($parts.FullName) + @($manifest, $checksums)
              gh release upload $tag @uploadFiles
              if ($LASTEXITCODE -ne 0) { throw "Could not upload $($package.Name) package assets: $LASTEXITCODE" }

              $partHashes = @{}
              foreach ($line in [System.IO.File]::ReadAllLines($checksums)) {
                $match = [regex]::Match($line, '^([0-9a-f]{64})  (.+)$')
                if (-not $match.Success) { throw "Malformed checksum file: $checksums" }
                $partHashes[$match.Groups[2].Value] = $match.Groups[1].Value
              }
              foreach ($part in $parts) {
                if (-not $partHashes.ContainsKey($part.Name)) { throw "Missing checksum for ZIP part: $($part.Name)" }
                $expectedAssets += [pscustomobject]@{
                  name = $part.Name
                  size = [long]$part.Length
                  sha256 = $partHashes[$part.Name]
                }
              }
              $expectedAssets += [pscustomobject]@{
                name = [System.IO.Path]::GetFileName($manifest)
                size = [long](Get-Item -LiteralPath $manifest).Length
                sha256 = $computedHash
              }
              $expectedAssets += [pscustomobject]@{
                name = [System.IO.Path]::GetFileName($checksums)
                size = [long](Get-Item -LiteralPath $checksums).Length
                sha256 = (Get-FileHash -LiteralPath $checksums -Algorithm SHA256).Hash.ToLowerInvariant()
              }

              Remove-Item -LiteralPath $stage -Recurse -Force
              Remove-Item -LiteralPath $parts.FullName -Force
              Remove-Item -LiteralPath $manifest, $checksums -Force
            }

            $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded release assets.' }
            $release = $releaseJson | ConvertFrom-Json
            $actualAssets = @($release.assets | ForEach-Object {
              [pscustomobject]@{
                name = [string]$_.name
                size = [long]$_.size
                digest = [string]$_.digest
                state = [string]$_.state
              }
            })
            if ($actualAssets.Count -ne $expectedAssets.Count) {
              throw "Release asset count mismatch: expected $($expectedAssets.Count), found $($actualAssets.Count)."
            }
            foreach ($expected in $expectedAssets) {
              $actual = @($actualAssets | Where-Object { $_.name -ceq $expected.name })
              if ($actual.Count -ne 1 -or $actual[0].size -ne $expected.size) {
                throw "Uploaded release asset is missing or has the wrong size: $($expected.name)"
              }
              if ($actual[0].state -cne 'uploaded' -or $actual[0].digest -cne "sha256:$($expected.sha256)") {
                throw "Uploaded release asset digest does not match: $($expected.name)"
              }
            }

            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Could not publish release: $LASTEXITCODE" }
            $releaseCreated = $false
          }
          catch {
            if ($releaseCreated) {
              $isDraft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
              if ($LASTEXITCODE -eq 0 -and $isDraft -eq 'true') {
                gh release delete $tag --yes
              }
            }
            throw
          }
